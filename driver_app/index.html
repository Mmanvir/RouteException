<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5eff">
<link rel="manifest" href="/driver-static/manifest.json">
<title>RouteException Driver</title>
<style>
  :root { --bg:#f3f4f7; --card:#fff; --ink:#12161d; --muted:#5d6676; --line:#dfe3ea; --accent:#1f5eff;
          --accent-ink:#fff; --ok:#0d7a4f; --bad:#b42318; --chip:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#171b22; --ink:#e7eaef; --muted:#9aa3b2; --line:#2b313b; --accent:#6f95ff;
            --accent-ink:#0e1116; --ok:#4fd3a0; --bad:#ff8a80; --chip:#1e2533; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--accent); color:var(--accent-ink); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; } header button { background:transparent; color:inherit; border:1px solid currentColor; border-radius:8px; padding:4px 10px; font:inherit; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:14px 16px 100px; }
  .stop { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; }
  .stop b { display:block; } .stop small, .muted { color:var(--muted); }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:2px 10px; font-size:13px; margin-top:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg button { padding:14px 8px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); font:600 15px system-ui; }
  .seg button.on { border-color:var(--accent); background:var(--chip); }
  .btn { width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:600 15px system-ui; }
  .primary { position:fixed; left:16px; right:16px; bottom:16px; max-width:528px; margin:0 auto; background:var(--accent); color:var(--accent-ink); border:0; padding:16px; border-radius:14px; font:700 16px system-ui; }
  .primary:disabled { opacity:.5; }
  img.preview { width:100%; border-radius:10px; margin-top:10px; display:none; }
  textarea { width:100%; min-height:70px; margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg); color:var(--ink); font:inherit; }
  .rec { background:var(--bad); color:#fff; border-color:var(--bad); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #toast { position:fixed; left:16px; right:16px; bottom:86px; max-width:528px; margin:0 auto; background:var(--ink); color:var(--bg); padding:12px 14px; border-radius:12px; display:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<header><h1 id="title">Today's stops</h1><button id="back" class="hidden">← Stops</button></header>
<main>
  <section id="list"><p class="muted">Loading stops…</p></section>

  <section id="form" class="hidden">
    <div class="card">
      <b id="s-addr"></b>
      <div class="muted" id="s-meta"></div>
    </div>

    <div class="card">
      <h2>1 · Delivery status</h2>
      <div class="seg" id="statuses">
        <button data-s="delivered">✅ Delivered</button>
        <button data-s="attempted">🚪 Attempted</button>
        <button data-s="damaged_reported">📦 Damaged</button>
        <button data-s="returned_to_hub">↩️ Return to hub</button>
      </div>
    </div>

    <div class="card">
      <h2>2 · Photo of door / gate</h2>
      <label class="btn" style="display:block;text-align:center">📷 Take photo
        <input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
      <img id="preview" class="preview" alt="Photo preview">
    </div>

    <div class="card">
      <h2>3 · Location</h2>
      <button class="btn" id="gps-btn">📍 Capture GPS</button>
      <p id="gps" class="muted" style="margin:8px 0 0">Not captured yet</p>
    </div>

    <div class="card">
      <h2>4 · Voice note (optional)</h2>
      <button class="btn" id="rec-btn">🎙️ Hold to record</button>
      <audio id="playback" controls class="hidden" style="width:100%;margin-top:10px"></audio>
      <textarea id="note" placeholder="…or type a short note (e.g. 'Nobody answered, gate locked')"></textarea>
    </div>
  </section>
</main>
<div id="toast"></div>
<button class="primary hidden" id="submit" disabled>Submit update</button>

<script>
const $ = id => document.getElementById(id);
let current = null, status = null, coords = null, voiceBlob = null, rec = null, chunks = [];

function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", ms); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadStops() {
  const r = await fetch("/api/driver/stops");
  const stops = await r.json();
  $("list").innerHTML = stops.length ? stops.map(s => `
    <div class="stop" data-id="${esc(s.id)}">
      <b>${esc(s.address)}</b>
      <small>${esc(s.customer_first_name)} · Gate ${esc(s.gate_number)} · ${esc(s.tracking_id)}</small><br>
      <span class="chip">${esc(s.status.replace("_"," "))}</span>
    </div>`).join("") : `<p class="muted">No stops assigned. Ask the dispatcher to load demo cases.</p>`;
  document.querySelectorAll(".stop").forEach(el => el.onclick = () => open(stops.find(s => s.id === el.dataset.id)));
}

function open(stop) {
  current = stop; status = null; coords = null; voiceBlob = null;
  $("list").classList.add("hidden"); $("form").classList.remove("hidden");
  $("submit").classList.remove("hidden"); $("back").classList.remove("hidden");
  $("title").textContent = stop.id;
  $("s-addr").textContent = stop.address;
  $("s-meta").textContent = `${stop.customer_first_name} · Gate ${stop.gate_number} · ${stop.tracking_id}`;
  document.querySelectorAll("#statuses button").forEach(b => b.classList.remove("on"));
  $("preview").style.display = "none"; $("photo").value = ""; $("note").value = "";
  $("playback").classList.add("hidden"); $("gps").textContent = "Not captured yet";
  captureGps(); validate();
}

function close() {
  $("form").classList.add("hidden"); $("list").classList.remove("hidden");
  $("submit").classList.add("hidden"); $("back").classList.add("hidden");
  $("title").textContent = "Today's stops"; loadStops();
}
$("back").onclick = close;

document.querySelectorAll("#statuses button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#statuses button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); status = b.dataset.s; validate();
});

$("photo").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  $("preview").src = URL.createObjectURL(f); $("preview").style.display = "block"; validate();
};

function captureGps() {
  if (!navigator.geolocation) { $("gps").textContent = "GPS not available on this device"; return; }
  $("gps").textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(
    p => { coords = p.coords; $("gps").innerHTML = `<span class="ok">✓ ${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)} (±${Math.round(coords.accuracy)} m)</span>`; validate(); },
    err => { $("gps").innerHTML = `<span class="bad">GPS failed: ${esc(err.message)}</span>`; },
    { enableHighAccuracy: true, timeout: 15000 });
}
$("gps-btn").onclick = captureGps;

async function startRec() {
  if (!navigator.mediaDevices?.getUserMedia) { toast("Recording needs HTTPS or localhost — type a note instead"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => { voiceBlob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      $("playback").src = URL.createObjectURL(voiceBlob); $("playback").classList.remove("hidden");
      stream.getTracks().forEach(t => t.stop()); };
    rec.start(); $("rec-btn").classList.add("rec"); $("rec-btn").textContent = "● Recording… release to stop";
  } catch (e) { toast("Microphone blocked: " + e.message); }
}
function stopRec() { if (rec && rec.state === "recording") { rec.stop(); $("rec-btn").classList.remove("rec"); $("rec-btn").textContent = "🎙️ Hold to record (re-record)"; } }
$("rec-btn").addEventListener("pointerdown", startRec);
["pointerup", "pointerleave", "pointercancel"].forEach(ev => $("rec-btn").addEventListener(ev, stopRec));

function validate() { $("submit").disabled = !status; }

$("submit").onclick = async () => {
  const fd = new FormData();
  fd.append("status", status);
  if (coords) { fd.append("lat", coords.latitude); fd.append("lon", coords.longitude); }
  const photo = $("photo").files[0]; if (photo) fd.append("photo", photo);
  if (voiceBlob) fd.append("voice", voiceBlob, "note." + (voiceBlob.type.includes("ogg") ? "ogg" : voiceBlob.type.includes("mp4") ? "m4a" : "webm"));
  const note = $("note").value.trim(); if (note) fd.append("note_text", note);
  if (status === "delivered" && !photo && !confirm("No photo attached. Submit anyway? The dispatcher will be alerted.")) return;
  $("submit").disabled = true; $("submit").textContent = "Uploading…";
  try {
    const r = await fetch(`/api/driver/stops/${encodeURIComponent(current.id)}/update`, { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const d = await r.json();
    toast(`✓ Sent (${d.recorded.join(", ")}). Dispatcher will review.`); close();
  } catch (e) { toast("Upload failed: " + e.message); }
  finally { $("submit").textContent = "Submit update"; validate(); }
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/driver-static/sw.js", { scope: "/driver-static/" }).catch(() => {});
loadStops();
</script>
</body>
</html>
