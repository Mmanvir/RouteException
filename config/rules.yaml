# RouteException business rules. Code reads this file; the LLM never decides any of it.

thresholds:
  gps_mismatch_meters: 200          # GPS vs address (Haversine)
  max_scan_gap_hours: 24            # gap between consecutive tracking scans
  photo_scan_gap_minutes: 30        # POD photo time vs delivered/attempted scan
  cause_confidence_threshold: 0.6   # below this the cause goes to needs_review

# Statuses that mean the driver reached (or claims to have reached) the door.
terminal_statuses: [delivered, attempted, returned_to_hub]

# Cause -> next action. Looked up by next_action.py. Never generated by the LLM.
actions:
  address_issue:
    action: Call customer to confirm address and landmark, then reschedule delivery
    owner: dispatcher
    priority: P2
    escalate_after_hours: 24
    customer_facing: "we need to confirm a few details of your delivery address so we can deliver your parcel"
  customer_unavailable:
    action: Offer the customer a new delivery slot or pickup point
    owner: dispatcher
    priority: P3
    escalate_after_hours: 48
    customer_facing: "we will contact you to arrange a new delivery time that suits you"
  damaged:
    action: Hold the parcel, open a damage inspection and arrange a replacement shipment decision
    owner: claims_team
    priority: P2
    escalate_after_hours: 24
    customer_facing: "we are reviewing the condition of your parcel and will update you on the next steps"
  wrong_delivery:
    action: Open a driver investigation, attempt recovery from the delivered location and verify POD
    owner: ops_lead
    priority: P1
    escalate_after_hours: 12
    customer_facing: "we are checking the delivery record for your parcel and working to locate it"
  delayed:
    action: Re-prioritise the parcel on the next route and confirm a new delivery date
    owner: dispatcher
    priority: P3
    escalate_after_hours: 24
    customer_facing: "we are arranging the earliest possible delivery for your parcel"
  needs_review:
    action: Manual review by dispatcher; evidence is inconclusive
    owner: dispatcher
    priority: P2
    escalate_after_hours: 12
    customer_facing: "we are reviewing the details of your delivery"

# Contradictions that bump the action regardless of cause.
contradiction_overrides:
  gps_vs_address:
    priority: P1
    extra_action: Verify driver GPS trail for the delivery scan
  photo_vs_address:
    priority: P1
    extra_action: Compare POD photo with the registered gate number
  status_vs_customer:
    extra_action: Hold any closure of the shipment until the customer dispute is resolved

# Fraud reports: we never contact police; the customer files the complaint.
fraud:
  helpline: "1930"
  portal: "https://cybercrime.gov.in"
